name: Build VNWN APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # публикация APK в Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Download sherpa-onnx library (AAR)
        run: |
          set -e
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          ls -lh app/libs

      # NLLB работает через ONNX Runtime, а в sherpa-onnx уже лежит свой (новый, собранный из
      # исходников) libonnxruntime.so. В APK должна попасть ровно ОДНА копия, и это должна быть
      # копия sherpa: она новее, и с ней работают и sherpa (его JNI требует свежий API), и
      # Java-часть ONNX Runtime (она старше и поэтому совместима). Кладём её в jniLibs
      # приложения: библиотеки самого приложения Gradle выбирает в первую очередь.
      - name: Use sherpa-onnx libonnxruntime.so as the single ONNX Runtime
        run: |
          set -e
          mkdir -p /tmp/aar && cd /tmp/aar
          unzip -q -o "$GITHUB_WORKSPACE/app/libs/sherpa-onnx.aar" 'jni/arm64-v8a/*'
          ls -l jni/arm64-v8a
          echo "--- сведения о libonnxruntime.so из sherpa-onnx:"
          strings -n 6 jni/arm64-v8a/libonnxruntime.so | grep -E 'ORT Build Info|git-branch=|git-commit-id=' | head -5 || true
          strings -n 5 jni/arm64-v8a/libonnxruntime.so | grep -E '^1\.[0-9]{2}\.[0-9]+$' | sort -Vu | head || true
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp jni/arm64-v8a/libonnxruntime.so "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libonnxruntime.so"
          sha256sum jni/arm64-v8a/libonnxruntime.so

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      # Модели в APK не входят: приложение скачивает их после установки
      # (релиз `models`, его создаёт workflow "Publish models").
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify the APK carries the sherpa libonnxruntime.so
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          mkdir -p /tmp/apk && cd /tmp/apk
          unzip -q -o "$GITHUB_WORKSPACE/$APK" 'lib/arm64-v8a/*'
          ls -l lib/arm64-v8a | grep -E 'onnxruntime|sherpa' || true
          A=$(sha256sum lib/arm64-v8a/libonnxruntime.so | cut -d' ' -f1)
          B=$(sha256sum /tmp/aar/jni/arm64-v8a/libonnxruntime.so | cut -d' ' -f1)
          echo "в APK:    $A"
          echo "у sherpa: $B"
          test "$A" = "$B" || { echo "::error::в APK попала другая libonnxruntime.so, не из sherpa-onnx"; exit 1; }

      - name: Publish APK to Release (tag "latest")
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" VNWN-debug.apk
          SIZE=$(stat -c %s VNWN-debug.apk)
          SHA=$(sha256sum VNWN-debug.apk | cut -d' ' -f1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VNWN-debug.apk --target "$GITHUB_SHA" \
            --title "VNWN (Voice Notes Wolf + NLLB) - latest debug build" \
            --notes "Автосборка из ${GITHUB_SHA::7}. Размер: $SIZE байт. SHA-256: $SHA" \
            --prerelease
